<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录日记本 · 深圳湾日记</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5" style="max-width: 420px;">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">欢迎来到深圳湾日记</h4>
      </div>
      <div class="card-body">
        {% if registered %}
        <div class="alert alert-success">注册成功，请登录。</div>
        {% endif %}

        <form id="loginForm" method="post" action="{{ url_for('diary.login') }}">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" value="{{ prefill_username }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">大侠请登录</button>
        </form>

        <a href="{{ url_for('diary.register') }}" class="btn btn-outline-secondary w-100 mt-2">新用户注册</a>

        <div id="errorMsg" class="alert alert-danger mt-3 d-none"></div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('diary.static', filename='js/login.js') }}"></script>
</body>
</html>
