<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册日记本 · 深圳湾日记</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5" style="max-width: 460px;">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">新用户注册</h4>
      </div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('diary.register') }}" autocomplete="off">
          <input type="text" name="fake_username" style="display:none" autocomplete="username">
          <input type="password" name="fake_password" style="display:none" autocomplete="current-password">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input id="registerUsername" type="text" name="username" class="form-control" value="" autocomplete="off" required>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input id="registerPassword" type="password" name="password" class="form-control" value="" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">再次输入密码</label>
            <input id="registerConfirmPassword" type="password" name="confirm_password" class="form-control" value="" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">注册并返回登录</button>
        </form>

        <a href="{{ url_for('diary.login') }}" class="btn btn-outline-secondary w-100 mt-2">返回登录</a>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const ids = ['registerUsername', 'registerPassword', 'registerConfirmPassword'];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.value = '';
          el.setAttribute('autocomplete', 'off');
        }
      });
    });
  </script>
</body>
</html>
